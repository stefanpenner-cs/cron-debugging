name: "Cron: Per-Expression Test"

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "*/11 * * * *"
  workflow_dispatch: {}

jobs:
  who-am-i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Actor and schedule info
        run: |
          echo "=== Actor ==="
          echo "actor:            ${{ github.actor }}"
          echo "triggering_actor: ${{ github.triggering_actor }}"
          echo "event:            ${{ github.event_name }}"
          echo "schedule:         ${{ github.event.schedule }}"
          echo "sha:              ${{ github.sha }}"

      - name: Which expression fired
        run: |
          if [ "${{ github.event.schedule }}" = "*/9 * * * *" ]; then
            echo "Fired: */9 expression (expression A — will be changed by bot)"
          elif [ "${{ github.event.schedule }}" = "*/11 * * * *" ]; then
            echo "Fired: */11 expression (expression B — unchanged)"
          else
            echo "Fired: ${{ github.event.schedule }} (unknown or workflow_dispatch)"
          fi

      - name: Last modifier of this file
        run: |
          git log -3 --format='%H %an <%ae> %s' -- .github/workflows/cron-per-expression-test.yml

      - name: Full event payload
        run: cat "$GITHUB_EVENT_PATH" | jq .
